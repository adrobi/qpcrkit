<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#145a63"/>
      <stop offset="1" stop-color="#0a2e36"/>
    </linearGradient>
    <clipPath id="tile"><rect x="12" y="12" width="232" height="232" rx="52"/></clipPath>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>
  <g clip-path="url(#tile)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- baseline and threshold -->
    <path d="M28 190 H228" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
    <path d="M28 148 H228" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="10 9"/>
    <!-- amplification curves: early (high expression) to late -->
    <path d="M28 190 C100 190 92 62 150 60 H228" stroke="#4aa3ff" stroke-width="10"/>
    <path d="M58 190 C130 190 122 76 180 74 H228" stroke="#3ccf5a" stroke-width="10"/>
    <path d="M88 190 C160 190 152 94 210 92 H228" stroke="#ffb547" stroke-width="10"/>
  </g>
  <!-- Cq: where each curve crosses the threshold -->
  <g fill="#ffffff">
    <circle cx="83.7" cy="148" r="8"/>
    <circle cx="116.3" cy="148" r="8"/>
    <circle cx="150.5" cy="148" r="8"/>
  </g>
</svg>
