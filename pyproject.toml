[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpcrkit"
dynamic = ["version"]
description = "Open-source desktop tool for qPCR analysis: Cq import, QC, standard curves, ΔΔCt/Pfaffl, statistics and publication figures"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "numpy",
    "scipy>=1.11",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller"]

[project.scripts]
qpcrkit = "qpcr_cli:main"

[tool.setuptools]
py-modules = ["qpcr_cli", "i18n", "translations_en"]

[tool.setuptools.packages.find]
include = ["qpcr_core*", "ui*"]

[tool.setuptools.dynamic]
version = { attr = "qpcr_core.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
